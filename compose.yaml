x-backend: &backend
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  env_file: .env
  volumes:
    - ./apps/backend:/app
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    s3: {condition: service_healthy}
    mailpit: {condition: service_started}
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    volumes: ["postgres-data:/var/lib/postgresql"]
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes: ["s3-data:/data"]
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
  api:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready/')"]
      interval: 10s
      timeout: 5s
      retries: 15
  worker:
    <<: *backend
    command: celery -A config worker --loglevel=INFO --concurrency=2 --max-tasks-per-child=50 --max-memory-per-child=262144
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 | python -c 'import sys; sys.exit(0 if \"pong\" in sys.stdin.read() else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
  beat:
    <<: *backend
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./packages/api-client/src:/workspace/packages/api-client/src
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  redis-data:
  s3-data:
